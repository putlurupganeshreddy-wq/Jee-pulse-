<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE PULSE</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#faf8f5;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#ece8e1;--ac:#5B5FEF;--pl:#EEF0FF;--ph:#3B82F6;--phl:#EAF3FF;--ch:#22C55E;--chl:#EAFBF0;--ma:#8B5CF6;--mal:#F1ECFF;--or:#F59E0B;--orl:#FFF7E6;--pk:#EC4899;--pkl:#FCECF5;--ok:#16A34A;--am:#F59E0B;--rd:#EF4444;--h1:#EEF0FF;--h2:#EAF3FF;--h3:#FCECF5;--sh:0 4px 16px #5b5fef14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2e37;--ac:#6366f1;--pl:#5b5fef26;--phl:#3b82f626;--chl:#22c55e22;--mal:#8b5cf628;--orl:#f59e0b22;--pkl:#ec489924;--h1:#1e2140;--h2:#16263f;--h3:#2d1a33;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2e37;--ac:#6366f1;--pl:#5b5fef26;--phl:#3b82f626;--chl:#22c55e22;--mal:#8b5cf628;--orl:#f59e0b22;--pkl:#ec489924;--h1:#1e2140;--h2:#16263f;--h3:#2d1a33;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer;letter-spacing:.04em}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
nav .side{display:none}
main{flex:1;padding:16px 16px 90px;max-width:960px;width:100%;margin:0 auto}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:16px 10px}nav button{flex:none;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;box-shadow:none!important}nav button.on{background:var(--pl)}nav .side{display:block}main{padding:24px}.hm{display:none}}
.logo{font-weight:800;letter-spacing:.06em;color:var(--ac);display:flex;gap:8px;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.t-pr{--t:var(--pl);--a:var(--ac)}.t-ph{--t:var(--phl);--a:var(--ph)}.t-ch{--t:var(--chl);--a:var(--ch)}.t-ma{--t:var(--mal);--a:var(--ma)}.t-or{--t:var(--orl);--a:var(--or)}.t-pk{--t:var(--pkl);--a:var(--pk)}
.tn{background:var(--t);border-color:transparent}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2) 55%,var(--h3));border-radius:24px;padding:18px;margin-bottom:12px;border:1px solid var(--bd)}
.qt{font-size:20px;line-height:1.35;font-weight:700;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(5,1fr)}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--t,var(--card));border-radius:16px;padding:11px}.st b{display:block;font-size:20px;font-weight:800;color:var(--a,var(--tx))}.st span,.mu{color:var(--mu);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.qa button{border:0;border-radius:16px;padding:13px 6px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;background:var(--t);color:var(--a);transition:transform .1s}.qa button:active{transform:scale(.96)}
h1{font-size:22px;margin:0;font-weight:800}h2{font-size:15px;margin:0 0 8px;font-weight:700}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;transition:transform .1s}.b:active{transform:scale(.97)}.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.em{text-align:center;color:var(--mu);padding:22px 8px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu)}
.err{color:var(--rd);font-size:13px;margin-top:6px}
.cd{display:flex;gap:14px;margin-top:6px}.cd b{font-size:24px;font-weight:800;display:block}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);width:min(94vw,520px);max-height:88vh}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fi{animation:fi .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.noanim *{transition:none!important;animation:none!important}
</style></head><body>
<div id="app"><nav id="nav" aria-label="Main"></nav><main id="main" tabindex="-1"></main></div>
<dialog id="dlg"></dialog>
<script>
const SUB={Physics:'var(--ph)',Chemistry:'var(--ch)',Mathematics:'var(--ma)'};
const QC={"JP": ["Every solved problem is a mark you no longer have to hope for.", "JEE rewards clear concepts, steady practice and calm decisions.", "Revise the mistakes you made, and the paper will repeat fewer of them.", "A mock test is a rehearsal, not a verdict.", "Accuracy first; speed is what accuracy becomes with practice.", "Know your weak chapters by name, then fix them one by one.", "Read the question twice and you will answer it once.", "Strong fundamentals make hard problems feel familiar.", "Treat every test as data about how to prepare better.", "The syllabus is finite; steady days are enough to finish it."], "DI": ["Discipline is doing the plan even on the days you do not feel like it.", "Your future rank is shaped by ordinary hours spent well.", "Start the session first; motivation usually arrives after.", "Decide the day's targets tonight, so tomorrow needs no debate.", "A small rule you keep is worth more than a big promise you break.", "Phone away, timer on, begin.", "Discipline is a kindness to your future self.", "Do the hardest topic when your mind is freshest.", "Keep promises to yourself the way you keep them to others.", "Habits decide on the days when willpower is low."], "CO": ["Consistency turns average days into an exceptional year.", "Two focused hours every day beat twelve hours once a month.", "Do not break the chain; shrink the task, not the habit.", "Progress hides in repetition until it suddenly shows.", "Show up today; that is the whole strategy.", "A steady pace finishes the race that sprinting never does.", "Small daily gains are quiet, and they add up loud.", "The best study plan is the one you can repeat tomorrow.", "Missed a day? Resume with the next hour, not with guilt.", "Regular revision keeps old chapters from becoming new problems."], "FO": ["Focus is saying no to ten good things so one important thing gets done.", "One problem, full attention, then the next.", "Deep work begins when the notifications end.", "A calm desk and a clear goal beat a long, distracted session.", "Where attention goes, learning follows.", "Single-task your way through the syllabus.", "Set a timer, choose one chapter, and stay with it.", "A distracted hour counts for less than a focused twenty minutes.", "Close the extra tabs; open the problem.", "Your attention is your most valuable study resource."], "HW": ["Hard work is making the effort even when the results are not visible yet.", "Effort you put in today is already working for your exam day.", "Difficult chapters become easy because someone kept practising.", "There is no shortcut around solving problems yourself.", "Work hard in private, and let the result speak.", "Sweat in practice so the paper feels lighter.", "Every hour of honest effort leaves you better than before.", "Talent opens the door; effort walks you through it.", "The pages you finish today are the confidence you carry tomorrow.", "Great preparation looks boring from the outside and powerful on result day."], "FA": ["A low score is information, not identity.", "Failing a test teaches what passing never reveals.", "Review the wrong answers; they are the most useful part of the paper.", "Setbacks are part of the path, not a detour from it.", "You have not failed until you stop learning from it.", "Bad test today, better plan tomorrow.", "Mistakes are the cheapest teachers you will ever have.", "Fall, analyse, adjust, continue.", "One poor result cannot erase months of honest work.", "Every strong student has a pile of mistakes behind them."], "IM": ["Aim to be a little better than your last test.", "Improvement is measured against yesterday, not against others.", "Track it, fix it, test it again.", "Fix one weak chapter this week, and your total will notice.", "Small corrections in method create big changes in marks.", "Reduce one type of mistake at a time.", "What you measure, you can improve.", "Growth is slow in the moment and obvious in hindsight.", "Learn from each test, then raise the bar a little.", "Better preparation is built from better reviews."], "CF": ["Confidence comes from preparation, so prepare honestly.", "You have solved hard problems before; you can solve this one.", "Trust the work you have already done.", "Believe in your process, and adjust it with evidence.", "Walk into the exam as someone who has practised for it.", "Calm is a skill, and it improves with every mock test.", "Self-belief grows each time you keep a promise to study.", "You do not need to be perfect, only prepared.", "Start with the questions you know; momentum builds belief.", "Your effort is real, and so is your progress."], "PA": ["Patience is understanding that mastery takes more than one attempt.", "Some concepts need three readings and a good night's sleep.", "Be patient with the chapter and kind to yourself.", "Results arrive on their own schedule; your work arrives on yours.", "Slow understanding is still understanding.", "Rushing the basics costs time later.", "Great things are built in long, quiet stretches.", "Wait for the concept to click; keep working while you wait.", "Growth rarely follows a straight line, and that is fine.", "Give the preparation time to compound."], "ST": ["Understand it, write it down, practise it, revise it.", "Teach a concept aloud, and you will find what you missed.", "Active recall beats rereading every time.", "Study the question types, not just the chapter titles.", "Short, frequent revisions keep formulas alive.", "Solve before you look at the solution.", "Make notes you would be happy to read the night before the exam.", "A formula you can derive is a formula you will not forget.", "Mix subjects in a week so no area goes cold.", "End each session by writing what you learned."], "RL": ["Rest, food and sleep are part of the study plan.", "Your worth is bigger than any single exam.", "Talk to someone when the pressure feels heavy.", "Take a walk; the problem will still be there, and so will you.", "Balance keeps you going longer than panic does.", "Compare your effort with your own plan, not with the toppers online.", "Real life continues beyond results, so look after yourself.", "Good friends and good sleep help good marks.", "Celebrate small wins; they keep you moving.", "Preparation is a phase of your life, not all of it."]};const CATS={"JP": "JEE Preparation", "DI": "Discipline", "CO": "Consistency", "FO": "Focus", "HW": "Hard Work", "FA": "Failure", "IM": "Improvement", "CF": "Confidence", "PA": "Patience", "ST": "Study", "RL": "Real Life"};const QL=[];for(let i=0;i<10;i++)for(const k in QC)QL.push({id:QL.length+1,text:QC[k][i],category:CATS[k],author:''});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayNum=(d=new Date())=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5);
function getDailyQuote(d=new Date()){return QL[((dayNum(d)%QL.length)+QL.length)%QL.length]}
let qx=null,qa=true,curDay=ymd(new Date());
function chq(){const c=(qx||getDailyQuote()).id;qx=QL[(c+Math.floor(Math.random()*(QL.length-1)))%QL.length];qa=true;render()}
function recordQ(){const k=ymd(new Date());S.qh=S.qh||[];if(!S.qh.some(h=>h.d===k)){S.qh.push({d:k,id:getDailyQuote().id});S.qh=S.qh.slice(-30)}}
function dqOn(c){S.dq=c;if(c&&'Notification' in window&&Notification.permission==='default'&&!S.asked){S.asked=1;Notification.requestPermission().catch(()=>{})}save();render()}
let S={name:'',dark:false,sound:true,anim:true,tests:[],chapters:[],log:[],last:null,dq:true,dqt:'07:00',qh:[]};
let view='home',metric='percentage',db;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),n=v=>v===''||v==null?0:+v;
function open(){return new Promise(r=>{const q=indexedDB.open('jeepulse',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()})}
function load(){return new Promise(r=>{if(!db)return r();const g=db.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>{if(g.result)S={...S,...g.result};r()};g.onerror=()=>r()})}
function save(){try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'state')}catch(e){toast('Could not save data: '+e.message)}}
function toast(m){const t=document.createElement('div');t.textContent=m;t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:99';document.body.append(t);setTimeout(()=>t.remove(),2600)}
let ac;function beep(f){if(!S.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.1)}catch(e){}}
function theme(){const d=S.dark;if(d===null)document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=d?'dark':'light';document.body.classList.toggle('noanim',!S.anim)}
const done=()=>S.tests.filter(t=>t.status==='Completed'&&t.scored!=null).sort((a,b)=>a.date.localeCompare(b.date));
const pct=t=>t.scored/t.total*100,acc=t=>t.correct+t.wrong?t.correct/(t.correct+t.wrong)*100:0,att=t=>t.tq?(t.correct+t.wrong)/t.tq*100:0;
const f1=v=>(Math.round(v*10)/10)+'';
function status(t){if(t.status==='Planned'&&new Date(t.date+'T23:59')<new Date())return'Missed';return t.status}
function streak(){const d=new Set(S.log);let c=0,x=new Date();if(!d.has(ymd(x)))x.setDate(x.getDate()-1);while(d.has(ymd(x))){c++;x.setDate(x.getDate()-1)}return c}
function mark(){const k=ymd(new Date());if(!S.log.includes(k))S.log.push(k)}
function pie(p,c,l){const r=26,C=2*Math.PI*r;return `<div style="text-align:center"><svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${l} ${p}%"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--bd)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 32 32)" stroke-linecap="round"/><text x="32" y="36" text-anchor="middle" font-size="13" fill="currentColor" font-weight="700">${p}%</text></svg><div class="mu">${l}</div></div>`}
const NAV=[['home','Home'],['tests','Tests'],['syllabus','Syllabus'],['analytics','Analytics'],['more','More']];
function nav(){$('#nav').innerHTML=`<div class="logo side"><img src="logo.png" alt="JEE PULSE" style="width:150px;height:auto"></div>`+NAV.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${l.toUpperCase()}</button>`).join('')}
function go(v){view=v;nav();render();scrollTo(0,0)}
function head(){const h=new Date().getHours(),g=h<12?'morning':h<17?'afternoon':'evening';return `<div class="row" style="margin-bottom:14px"><div><div class="logo hm"><img src="favicon.png" alt="" width="36" height="36" style="border-radius:9px">JEE PULSE</div><h1>Good ${g[0].toUpperCase()+g.slice(1)}${S.name?', '+esc(S.name):''} 👋</h1><div class="mu">${view==='home'?"Let's make today's preparation count.":new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div style="display:flex;gap:6px"><button class="b g" onclick="S.dark=!(S.dark??matchMedia('(prefers-color-scheme:dark)').matches);theme();save();render()" aria-label="Toggle theme">${S.dark?'☀':'☾'}</button><button class="b g" onclick="S.sound=!S.sound;save();render()" aria-label="Toggle sound">${S.sound?'🔊':'🔇'}</button></div></div>`}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){const d=done(),T=S.tests,now=new Date(),today=ymd(now),mo=today.slice(0,7);
const nx=T.filter(t=>t.status==='Planned'&&new Date(t.date+'T'+(t.time||'09:00'))>now).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))) [0];
const L=d.at(-1),P=d.at(-2),av=l=>l.length?Math.round(l.reduce((a,c)=>a+c.pct,0)/l.length):null,pc=av(S.chapters);
const neg=d.reduce((a,t)=>a+t.neg,0),cw=d.reduce((a,t)=>a+t.correct+t.wrong,0),cc=d.reduce((a,t)=>a+t.correct,0);
const cards=[['Total tests',d.length||'--','pr'],['Planned',T.filter(t=>status(t)==='Planned').length||'--','ma'],['This month',d.filter(t=>t.date.startsWith(mo)).length||'--','pr'],['Latest score',L?`${L.scored}/${L.total}`:'--','ph'],['Best score',d.length?f1(Math.max(...d.map(pct)))+'%':'--','ch'],['Average',d.length?f1(d.reduce((a,t)=>a+pct(t),0)/d.length)+'%':'--','or'],['Accuracy',cw?f1(cc/cw*100)+'%':'--','pk'],['Negative marks',d.length?neg:'--','or'],['Syllabus',pc==null?'--':pc+'%','ma'],['Study streak',streak()?streak()+' d':'--','ch']];
const q=qx||getDailyQuote(),an=qa&&S.anim;qa=false;
const days=nx?Math.max(0,Math.ceil((new Date(nx.date+'T'+(nx.time||'09:00'))-now)/864e5)):0;
const wk=ymd(new Date(Date.now()+7*864e5)),due=S.chapters.filter(c=>c.target&&c.pct<100),over=due.filter(c=>c.target<today),soon=due.filter(c=>c.target>=today&&c.target<=wk);
let ins=[];if(P){if(acc(L)>acc(P))ins.push('Your accuracy improved compared with your previous test.');if(L.neg>P.neg)ins.push('Negative marks increased in the last test.');if(pct(L)>pct(P))ins.push('Your score rose by '+f1(pct(L)-pct(P))+' points.')}
if(d.length){const s=['Physics','Chemistry','Mathematics'].map(k=>[k,d.reduce((a,t)=>a+t[k[0].toLowerCase()],0)]).sort((a,b)=>b[1]-a[1]);if(s[0][1]>s[2][1])ins.push(s[0][0]+' is currently your highest-scoring subject.')}
const hist=(S.qh||[]).filter(h=>h.d!==today).slice(-5).reverse();
const subs=['Physics','Chemistry','Mathematics'].map((s,i)=>{const k=s[0].toLowerCase(),cl=['ph','ch','ma'][i],ch=S.chapters.filter(c=>c.subj===s),sp=av(ch),am=d.length?d.reduce((a,t)=>a+t[k],0)/d.length:null,tr=P?L[k]-P[k]:null;
return `<div class="card tn t-${cl}" onclick="go('analytics')" onkeydown="if(event.key==='Enter')go('analytics')" tabindex="0" role="button" aria-label="${s} analytics" style="cursor:pointer;margin:0;padding:12px"><b style="color:var(--a)">${['⚛','⚗','π'][i]} ${s}</b><div class="mu">Avg marks <b>${am==null?'--':f1(am)}</b></div>${tr==null?'':`<div style="font-size:12px;font-weight:700;color:${tr>=0?'var(--ok)':'var(--rd)'}">${tr>=0?'▲ +':'▼ '}${f1(tr)}</div>`}<div class="mu">Syllabus ${sp==null?'--':sp+'%'}</div><div class="bar"><i style="width:${sp||0}%;background:var(--a)"></i></div></div>`}).join('');
const dif=P?L.scored-P.scored:0;
return head()+`<div class="hero"><div class="row"><div style="display:flex;gap:12px;align-items:center"><img src="logo.png" alt="JEE PULSE logo" width="72" height="72" style="width:72px;height:72px;object-fit:contain;border-radius:16px;background:#fff"><div><div class="logo" style="margin:0;font-size:15px">JEE PULSE</div><div class="mu">Track. Test. Improve. Repeat.</div></div></div><div class="mu" style="text-align:right">${now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'})}</div></div>`+(S.dq===false?'':`<div class="${an?'fi':''}" style="margin-top:14px"><div class="mu" style="letter-spacing:.1em;font-weight:700">${qx?'ANOTHER PULSE':"TODAY'S PULSE"}</div><p class="qt">“${esc(q.text)}”</p><div class="row"><span class="tag">${q.category}</span><span class="mu">— JEE PULSE</span></div></div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="b g" onclick="chq()">↻ Change Quote</button>${qx?`<button class="b g" onclick="qx=null;qa=true;render()">Today's Quote</button>`:''}</div>`)+`</div>
<div class="card tn t-or"><div class="row"><b style="color:var(--a)">NEXT TEST</b>${nx?`<span class="tag" style="color:var(--a)">${days} DAY${days==1?'':'S'} LEFT</span>`:''}</div>`+(nx?`<div style="font-size:18px;font-weight:800;margin-top:4px">${esc(nx.name)}</div><div class="mu">${nx.date} · ${esc(nx.type)}</div><div class="cd" id="cd" data-t="${nx.date}T${nx.time||'09:00'}"></div><button class="b" style="margin-top:10px" onclick="go('tests')">View Test</button>`:`<div class="em" style="padding:8px">No upcoming test scheduled.<br><br><button class="b" onclick="testForm()">+ Schedule Test</button></div>`)+`</div>
<div class="qa"><button class="t-pr" onclick="testForm()">+ Add Test</button><button class="t-ph" onclick="testForm('','Completed')">+ Add Result</button><button class="t-ch" onclick="chForm()">+ Add Chapter</button></div>
<div class="grid">${cards.map(c=>`<div class="st t-${c[2]}"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>
<h2 style="margin:14px 0 8px">Subjects</h2><div class="g3">${subs}</div>`+(S.chapters.length?`<div class="card row" style="justify-content:space-around">${pie(pc,'var(--ac)','JEE Syllabus')}${['Physics','Chemistry','Mathematics'].map((s,i)=>pie(av(S.chapters.filter(c=>c.subj===s))||0,['var(--ph)','var(--ch)','var(--ma)'][i],s.slice(0,4)+'.')).join('')}</div>`:'')+`
<div class="card tn t-pr"><h2>PERFORMANCE PULSE</h2>${P?`<div class="row" style="text-align:center;justify-content:space-around"><div><span class="mu">Previous</span><b style="display:block;font-size:22px">${P.scored}</b></div><div><span class="mu">Latest</span><b style="display:block;font-size:22px">${L.scored}</b></div><div><span class="mu">Change</span><b style="display:block;font-size:22px;color:${dif>=0?'var(--ok)':'var(--rd)'}">${dif>0?'+':''}${dif}</b></div></div>`:'<div class="mu">Complete two tests to compare your latest score with the previous one.</div>'}</div>
<div class="card"><h2>Today's Targets</h2>${!S.chapters.length?'<div class="mu">Add chapters with target dates in Syllabus to see targets here.</div>':`<div class="mu">Overdue: ${over.length} · Due within 7 days: ${soon.length}</div>`+[...over,...soon].map(c=>`<div class="row" style="padding:5px 0"><span><span style="color:${SUB[c.subj]}">●</span> ${esc(c.name)} <span class="mu">${c.target}${c.target<today?' · overdue':''}</span></span><button class="b g" onclick="setPct('${c.id}',100)">Done</button></div>`).join('')}</div>
<div class="card"><h2>Insights</h2>${ins.length?ins.map(i=>`<div>• ${i}</div>`).join(''):'<div class="mu">Insights appear once your recorded tests support them.</div>'}</div>
<div class="card"><h2>Recent Tests</h2>${d.length?d.slice(-3).reverse().map(testCard).join(''):'<div class="em">No tests recorded yet.<br>Add your first JEE test to start tracking performance.</div>'}</div>`+(hist.length&&S.dq!==false?`<div class="card"><h2>Quote History</h2>${hist.map(h=>{const df=dayNum(now)-dayNum(new Date(h.d+'T00:00')),q2=QL.find(x=>x.id===h.id);return q2?`<div style="padding:5px 0"><span class="mu">${df==1?'Yesterday':df+' days ago'}</span><div>“${esc(q2.text)}”</div></div>`:''}).join('')}</div>`:'')}
function testCard(t){const s=status(t);const done=t.status==='Completed'&&t.scored!=null;return `<div class="card" style="margin:8px 0;border-left:4px solid var(--ac)"><div class="row"><b>${esc(t.name)}</b><span class="tag">${s}</span></div><div class="mu">${t.date} · ${esc(t.type)}${t.link?` · <a href="${esc(t.link)}" target="_blank" rel="noopener">link</a>`:''}</div>${done?`<div style="margin-top:6px"><b>${t.scored}/${t.total}</b> (${f1(pct(t))}%) · Accuracy ${f1(acc(t))}% · Wrong ${t.wrong} · Neg ${t.neg}</div><div class="mu"><span style="color:var(--ph)">Phy ${t.p}</span> · <span style="color:var(--ch)">Chem ${t.c}</span> · <span style="color:var(--ma)">Math ${t.m}</span> · Attempt ${f1(att(t))}%</div>`:''}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="b g" onclick="testForm('${t.id}')">${done?'Edit':'Enter result'}</button><button class="b g" onclick="delTest('${t.id}')">Delete</button></div></div>`}
let tf='All',ts='';
function tests(){let L=[...S.tests].sort((a,b)=>b.date.localeCompare(a.date)).filter(t=>(tf==='All'||status(t)===tf)&&t.name.toLowerCase().includes(ts.toLowerCase()));
return head()+`<div class="row"><h1>Tests</h1><button class="b" onclick="testForm()">+ Add Test</button></div><div class="f2" style="margin:10px 0"><input placeholder="Search tests" value="${esc(ts)}" oninput="ts=this.value;render();document.querySelector('[placeholder=\\'Search tests\\']').focus()" aria-label="Search tests"><select onchange="tf=this.value;render()" aria-label="Status filter">${['All','Planned','Completed','Missed'].map(x=>`<option ${x===tf?'selected':''}>${x}</option>`).join('')}</select></div>`+(L.length?L.map(testCard).join(''):`<div class="em">No tests recorded yet.<br>Start tracking your JEE performance.<br><br><button class="b" onclick="testForm()">+ Add First Test</button></div>`)}
function testForm(id,pre){const t=S.tests.find(x=>x.id===id)||{status:pre||'Planned',type:'Coaching Test',date:ymd(new Date()),total:300,tq:75};const D=$('#dlg');
const v=(k,d='')=>esc(t[k]??d);
D.innerHTML=`<form method="dialog" onsubmit="return false"><h2>${id?'Edit':'New'} Test</h2><label>Test name</label><input id="f_name" value="${v('name')}"><div class="f2"><div><label>Date</label><input id="f_date" type="date" value="${v('date')}"></div><div><label>Time</label><input id="f_time" type="time" value="${v('time','09:00')}"></div><div><label>Type</label><select id="f_type">${['JEE Main','JEE Advanced','Coaching Test','Chapter Test','Full Syllabus Test','Custom'].map(x=>`<option ${x===t.type?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Status</label><select id="f_status" onchange="$('#res').hidden=this.value!=='Completed'">${['Planned','Completed','Missed'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Total marks</label><input id="f_total" type="number" value="${v('total')}"></div><div><label>Total questions</label><input id="f_tq" type="number" value="${v('tq')}"></div></div><label>Test link</label><input id="f_link" type="url" value="${v('link')}">
<div id="res" ${t.status==='Completed'?'':'hidden'}><h2 style="margin-top:14px">Result</h2><div class="f2"><div><label>Marks scored</label><input id="f_scored" type="number" value="${v('scored')}"></div><div><label>Negative marks</label><input id="f_neg" type="number" value="${v('neg')}"></div><div><label>Correct</label><input id="f_correct" type="number" value="${v('correct')}"></div><div><label>Wrong</label><input id="f_wrong" type="number" value="${v('wrong')}"></div><div><label style="color:var(--ph)">Physics marks</label><input id="f_p" type="number" value="${v('p')}"></div><div><label style="color:var(--ch)">Chemistry marks</label><input id="f_c" type="number" value="${v('c')}"></div><div><label style="color:var(--ma)">Maths marks</label><input id="f_m" type="number" value="${v('m')}"></div></div><div class="mu">Unattempted, accuracy and percentage are calculated automatically.</div></div>
<div id="e" class="err" role="alert"></div><div class="row" style="margin-top:12px"><button class="b g" onclick="$('#dlg').close()">Cancel</button><button class="b" onclick="saveTest('${id||''}')">Save</button></div></form>`;D.showModal()}
function saveTest(id){const g=k=>$('#f_'+k).value,E=m=>($('#e').textContent=m,beep(180),false);
const t={id:id||uid(),name:g('name').trim(),date:g('date'),time:g('time'),type:g('type'),status:g('status'),total:n(g('total')),tq:n(g('tq')),link:g('link')};
if(!t.name)return E('Test name cannot be empty.');if(!t.date||isNaN(new Date(t.date)))return E('Please enter a valid date.');if(t.total<=0)return E('Total marks must be greater than zero.');
if(t.status==='Completed'){Object.assign(t,{scored:n(g('scored')),neg:n(g('neg')),correct:n(g('correct')),wrong:n(g('wrong')),p:n(g('p')),c:n(g('c')),m:n(g('m'))});
if(g('scored')==='')return E('Enter marks scored.');if(t.scored>t.total)return E('Marks scored cannot exceed total marks.');if(t.correct+t.wrong>t.tq)return E('Attempted questions cannot be greater than total questions.');if([t.scored,t.neg,t.correct,t.wrong].some(x=>x<0))return E('Values cannot be negative.');
t.un=t.tq-t.correct-t.wrong;mark()}
const i=S.tests.findIndex(x=>x.id===t.id);i>=0?S.tests[i]=t:S.tests.push(t);save();$('#dlg').close();beep(660);toast('Test saved');render()}
function delTest(id){if(confirm('Delete this test permanently?')){S.tests=S.tests.filter(t=>t.id!==id);save();render()}}
function syllabus(){const subs=Object.keys(SUB);const all=S.chapters,avg=l=>l.length?Math.round(l.reduce((a,c)=>a+c.pct,0)/l.length):0;
return head()+`<div class="row"><h1>Syllabus</h1><button class="b" onclick="chForm()">+ Chapter</button></div>`+(all.length?`<div class="card row" style="justify-content:space-around">${pie(avg(all),'var(--ac)','Overall')}${subs.map(s=>pie(avg(all.filter(c=>c.subj===s)),SUB[s],s)).join('')}</div>`:'')+(all.length?subs.map(s=>{const l=all.filter(c=>c.subj===s);return l.length?`<div class="card"><h2 style="color:${SUB[s]}">${s}</h2>${l.map(c=>`<div style="padding:6px 0"><div class="row"><span>${esc(c.name)} <span class="mu">${c.target?'· target '+c.target:''}</span></span><span class="mu">${c.pct>=100?'Completed':c.pct>0?'Studying':'Not started'}</span></div><input type="range" min="0" max="100" step="10" value="${c.pct}" onchange="setPct('${c.id}',+this.value)" aria-label="${esc(c.name)} completion"><div class="bar"><i style="width:${c.pct}%;background:${SUB[s]}"></i></div><button class="b g" style="margin-top:4px;padding:3px 8px;font-size:12px" onclick="S.chapters=S.chapters.filter(x=>x.id!=='${c.id}');save();render()">Remove</button></div>`).join('')}</div>`:''}).join(''):`<div class="em">Add your first chapter to start tracking syllabus progress.<br><br><button class="b" onclick="chForm()">+ Add Chapter</button></div>`)}
function setPct(id,p){const c=S.chapters.find(x=>x.id===id);c.pct=p;if(p>=100){mark();beep(660)}save();render()}
function chForm(){$('#dlg').innerHTML=`<h2>New Chapter</h2><label>Subject</label><select id="c_s">${Object.keys(SUB).map(s=>`<option>${s}</option>`).join('')}</select><label>Chapter name</label><input id="c_n"><label>Target date</label><input id="c_t" type="date"><div id="e" class="err"></div><div class="row" style="margin-top:12px"><button class="b g" onclick="$('#dlg').close()">Cancel</button><button class="b" onclick="const nm=$('#c_n').value.trim();if(!nm)return $('#e').textContent='Chapter name cannot be empty.';S.chapters.push({id:uid(),subj:$('#c_s').value,name:nm,target:$('#c_t').value,pct:0});save();$('#dlg').close();render()">Add</button></div>`;$('#dlg').showModal()}
function chart(pts,lab){if(pts.length<2)return'';const W=640,H=220,P=34,mx=Math.max(...pts),mn=Math.min(...pts),r=mx-mn||1,x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)/r*(H-2*P);
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="${lab} trend"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--ac)"/><text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" font-size="11" fill="currentColor">${f1(v)}</text>`).join('')}<text x="4" y="14" font-size="11" fill="var(--mu)">max ${f1(mx)}</text><text x="4" y="${H-8}" font-size="11" fill="var(--mu)">min ${f1(mn)}</text></svg>`}
function analytics(){const d=done();const M={marks:t=>t.scored,percentage:pct,accuracy:acc,'attempt rate':att};const pts=d.map(M[metric]);
return head()+`<h1>Analytics</h1>`+(d.length<2?`<div class="card em">Complete at least two tests to unlock your improvement curve.</div>`:`<div class="card"><div class="row"><h2>Test improvement curve</h2><select style="width:auto" onchange="metric=this.value;render()" aria-label="Metric">${Object.keys(M).map(k=>`<option ${k===metric?'selected':''}>${k}</option>`).join('')}</select></div>${chart(pts,metric)}<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="st"><span>Latest</span><b>${f1(pts.at(-1))}</b></div><div class="st"><span>Average</span><b>${f1(pts.reduce((a,b)=>a+b)/pts.length)}</b></div><div class="st"><span>Best</span><b>${f1(Math.max(...pts))}</b></div><div class="st"><span>Lowest</span><b>${f1(Math.min(...pts))}</b></div><div class="st"><span>Vs previous</span><b>${f1(pts.at(-1)-pts.at(-2))}</b></div><div class="st"><span>Trend</span><b>${pts.at(-1)>pts[0]?'↑ Up':pts.at(-1)<pts[0]?'↓ Down':'→ Flat'}</b></div></div></div>
<div class="card"><h2>Subject marks (average)</h2>${Object.keys(SUB).map(s=>{const k=s[0].toLowerCase(),a=d.reduce((x,t)=>x+t[k],0)/d.length;return `<div class="row"><span style="color:${SUB[s]}">${s}</span><b>${f1(a)}</b></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,a/(Math.max(...d.map(t=>t.total))/3)*100))}%;background:${SUB[s]}"></i></div>`}).join('')}</div>
<div class="card"><h2>Negative marks per test</h2>${chart(d.map(t=>t.neg),'negative marks')}</div>`)}
function more(){return head()+`<h1>More</h1><div class="card"><h2>Settings</h2><label>Student name</label><input value="${esc(S.name)}" onchange="S.name=this.value;save();render()"><label>Theme</label><select onchange="S.dark=this.value==='system'?null:this.value==='dark';theme();save()"><option value="system" ${S.dark===null?'selected':''}>System</option><option value="light" ${S.dark===false?'selected':''}>Light</option><option value="dark" ${S.dark===true?'selected':''}>Dark</option></select><div class="row" style="margin-top:10px"><span>Animations</span><input type="checkbox" style="width:auto" ${S.anim?'checked':''} onchange="S.anim=this.checked;theme();save()"></div></div>
<div class="card"><h2>Daily Quote</h2><div class="row"><span>Show daily quote</span><input type="checkbox" style="width:auto" ${S.dq!==false?'checked':''} onchange="dqOn(this.checked)" aria-label="Show daily quote"></div><label>Preferred time</label><input type="time" value="${S.dqt||'07:00'}" onchange="S.dqt=this.value;save()"><div class="mu" style="margin-top:6px">The quote changes automatically every day and works offline. Reminder notifications are planned for a later update; for now the quote stays on Home.</div></div>
<div class="card"><h2>Backup</h2><div class="mu">Last backup: ${S.last?new Date(S.last).toLocaleString():'never'}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="b" onclick="exp()">Export JSON</button><button class="b g" onclick="csv()">Export CSV</button><label class="b g" style="margin:0">Import JSON<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="b g" style="color:var(--rd)" onclick="clr()">Clear all data</button></div></div>
<div class="card"><h2>Coming next</h2><div class="mu">Mistake Book, Study Records, Goals, attachments, global search, calendar and PDF reports are planned for later versions of this app.</div></div>`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exp(){S.last=Date.now();save();dl('jee-pulse-backup-'+ymd(new Date())+'.json',JSON.stringify({app:'jee-pulse',v:1,data:S}),'application/json');toast('Backup exported')}
function csv(){const d=done();if(!d.length)return toast('No completed tests to export yet.');const h=['name','date','type','scored','total','correct','wrong','neg','physics','chemistry','maths'];dl('jee-pulse-tests.csv',[h.join(','),...d.map(t=>[`"${t.name.replace(/"/g,'""')}"`,t.date,t.type,t.scored,t.total,t.correct,t.wrong,t.neg,t.p,t.c,t.m].join(','))].join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result);if(j.app!=='jee-pulse'||!j.data)throw 0}catch(e){return toast('Invalid backup file.')}
const D=j.data,nt=(D.tests||[]).length,nc=(D.chapters||[]).length;
if(!confirm(`Backup contains ${nt} tests and ${nc} chapters.\n\nOK = MERGE (adds new records, skips duplicates)\nCancel = choose another option`)){if(confirm('REPLACE all current data with this backup? This cannot be undone.')){S={...S,...D};save();theme();render();toast('Data replaced')}return}
const ti=new Set(S.tests.map(t=>t.id)),ci=new Set(S.chapters.map(c=>c.id));const at=(D.tests||[]).filter(t=>!ti.has(t.id)),ac2=(D.chapters||[]).filter(c=>!ci.has(c.id));S.tests.push(...at);S.chapters.push(...ac2);save();render();toast(`Merged ${at.length} tests, ${ac2.length} chapters; ${nt-at.length+nc-ac2.length} duplicates skipped`)};r.onerror=()=>toast('Could not read file.');r.readAsText(f)}
function clr(){if(confirm('Delete ALL JEE PULSE data? This cannot be undone. Export a backup first.')&&prompt('Type DELETE to confirm')==='DELETE'){S={...S,tests:[],chapters:[],log:[],name:''};save();render()}}
function render(){$('#main').innerHTML={home,tests,syllabus,analytics,more}[view]();tick()}
function tick(){const k=ymd(new Date());if(k!==curDay){curDay=k;qx=null;qa=true;recordQ();if(view==='home')return render()}const e=$('#cd');if(!e)return;const ms=new Date(e.dataset.t)-new Date();if(ms<=0){return render()}const s=Math.floor(ms/1e3);e.innerHTML=[['Days',Math.floor(s/86400)],['Hours',Math.floor(s%86400/3600)],['Min',Math.floor(s%3600/60)],['Sec',s%60]].map(([l,v])=>`<div><b>${String(v).padStart(2,'0')}</b><span class="mu">${l}</span></div>`).join('')}
setInterval(tick,1000);
(async()=>{theme();nav();render();try{await Promise.race([(async()=>{await open();await load()})(),new Promise(r=>setTimeout(r,3000))]);if(S.dark===null&&!S.v2)S.dark=false;S.v2=1;recordQ();qa=true;theme();nav();render()}catch(e){console.error(e)}})();
</script></body></html>
