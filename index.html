<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE PULSE</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f766e">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#0f766e;--ph:#2563eb;--ch:#16a34a;--ma:#7c3aed;--rd:#dc2626;--am:#d97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2e37;--ac:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2e37;--ac:#2dd4bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font:600 11px system-ui;cursor:pointer;letter-spacing:.04em}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
nav .side{display:none}
main{flex:1;padding:16px 16px 90px;max-width:960px;width:100%;margin:0 auto}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:16px 10px}nav button{flex:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;box-shadow:none!important}nav button.on{background:var(--bg)}nav .side{display:block}nav .m{display:none}main{padding:24px}.hm{display:none}}
.logo{font-weight:800;letter-spacing:.06em;color:var(--ac);display:flex;gap:8px;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 1px 3px #0000000d;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(5,1fr)}}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.st b{display:block;font-size:20px}.st span,.mu{color:var(--mu);font-size:12px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 8px}
button.b,.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer;transition:transform .1s}.b:active{transform:scale(.97)}.b.g{background:none;color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.em{text-align:center;color:var(--mu);padding:22px 8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.err{color:var(--rd);font-size:13px;margin-top:6px}
.cd{display:flex;gap:14px}.cd b{font-size:24px;display:block}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,520px);max-height:88vh}
.rm{ @media (prefers-reduced-motion:reduce){} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.noanim *{transition:none!important}
</style></head><body>
<div id="app"><nav id="nav" aria-label="Main"></nav><main id="main" tabindex="-1"></main></div>
<dialog id="dlg"></dialog>
<script>
const SUB={Physics:'var(--ph)',Chemistry:'var(--ch)',Mathematics:'var(--ma)'};
const Q={Study:["Small daily effort compounds into rank.","Understand first, then practise, then revise."],Discipline:["Discipline is choosing what you want most over what you want now.","Show up even when motivation does not."],Consistency:["Consistency beats intensity.","One focused hour daily outruns one frantic weekend."],Failure:["A wrong answer found today is a mark saved on exam day.","Every mistake is data, not a verdict."],"Real life":["Rest is part of the plan.","Compare yourself only to your last test."],"JEE preparation":["Accuracy first, speed follows.","Revise the mistake book before every test."]};
let S={name:'',dark:null,sound:true,anim:true,tests:[],chapters:[],log:[],last:null,qi:0,qc:'Study'};
let view='home',metric='percentage',db;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),n=v=>v===''||v==null?0:+v;
function open(){return new Promise(r=>{const q=indexedDB.open('jeepulse',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()})}
function load(){return new Promise(r=>{if(!db)return r();const g=db.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>{if(g.result)S={...S,...g.result};r()};g.onerror=()=>r()})}
function save(){try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'state')}catch(e){toast('Could not save data: '+e.message)}}
function toast(m){const t=document.createElement('div');t.textContent=m;t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:99';document.body.append(t);setTimeout(()=>t.remove(),2600)}
let ac;function beep(f){if(!S.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.1)}catch(e){}}
function theme(){const d=S.dark;if(d===null)document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=d?'dark':'light';document.body.classList.toggle('noanim',!S.anim)}
const done=()=>S.tests.filter(t=>t.status==='Completed'&&t.scored!=null).sort((a,b)=>a.date.localeCompare(b.date));
const pct=t=>t.scored/t.total*100,acc=t=>t.correct+t.wrong?t.correct/(t.correct+t.wrong)*100:0,att=t=>t.tq?(t.correct+t.wrong)/t.tq*100:0;
const f1=v=>(Math.round(v*10)/10)+'';
function status(t){if(t.status==='Planned'&&new Date(t.date+'T23:59')<new Date())return'Missed';return t.status}
function streak(){const d=new Set(S.log);let c=0,x=new Date();if(!d.has(x.toISOString().slice(0,10)))x.setDate(x.getDate()-1);while(d.has(x.toISOString().slice(0,10))){c++;x.setDate(x.getDate()-1)}return c}
function mark(){const k=new Date().toISOString().slice(0,10);if(!S.log.includes(k))S.log.push(k)}
function pie(p,c,l){const r=26,C=2*Math.PI*r;return `<div style="text-align:center"><svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${l} ${p}%"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--bd)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 32 32)" stroke-linecap="round"/><text x="32" y="36" text-anchor="middle" font-size="13" fill="currentColor" font-weight="700">${p}%</text></svg><div class="mu">${l}</div></div>`}
const NAV=[['home','Home'],['tests','Tests'],['syllabus','Syllabus'],['analytics','Analytics'],['more','More']];
function nav(){$('#nav').innerHTML=`<div class="logo side"><img src="logo.png" alt="JEE PULSE" style="width:150px;height:auto"></div>`+NAV.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${l.toUpperCase()}</button>`).join('')}
function go(v){view=v;nav();render();scrollTo(0,0)}
function head(){const h=new Date().getHours(),g=h<12?'morning':h<17?'afternoon':'evening';return `<div class="row" style="margin-bottom:14px"><div><div class="logo hm"><img src="favicon.png" alt="" width="28" height="28" style="border-radius:7px">JEE PULSE</div><h1>Good ${g}${S.name?', '+esc(S.name):''}.</h1><div class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div style="display:flex;gap:6px"><button class="b g" onclick="S.dark=!(S.dark??matchMedia('(prefers-color-scheme:dark)').matches);theme();save();render()" aria-label="Toggle theme">${S.dark?'☀':'☾'}</button><button class="b g" onclick="S.sound=!S.sound;save();render()" aria-label="Toggle sound">${S.sound?'🔊':'🔇'}</button></div></div>`}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){const d=done(),T=S.tests,now=new Date(),mo=now.toISOString().slice(0,7);
const nx=T.filter(t=>t.status==='Planned'&&new Date(t.date+'T'+(t.time||'09:00'))>now).sort((a,b)=>a.date.localeCompare(b.date))[0];
const L=d[d.length-1],pc=S.chapters.length?Math.round(S.chapters.reduce((a,c)=>a+c.pct,0)/S.chapters.length):null;
const neg=d.reduce((a,t)=>a+t.neg,0),cw=d.reduce((a,t)=>a+t.correct+t.wrong,0),cc=d.reduce((a,t)=>a+t.correct,0);
const cards=[['Tests attended',d.length||'--'],['Tests planned',T.filter(t=>status(t)==='Planned').length||'--'],['Completed this month',d.filter(t=>t.date.startsWith(mo)).length||'--'],['Latest score',L?`${L.scored}/${L.total}`:'--'],['Best score',d.length?Math.max(...d.map(pct)).toFixed(1)+'%':'--'],['Average',d.length?f1(d.reduce((a,t)=>a+pct(t),0)/d.length)+'%':'--'],['Overall accuracy',cw?f1(cc/cw*100)+'%':'--'],['Negative marks',d.length?neg:'--'],['Syllabus done',pc==null?'--':pc+'%'],['Study streak',streak()?streak()+' d':'--']];
const q=Q[S.qc][S.qi%Q[S.qc].length];
const today=now.toISOString().slice(0,10),due=S.chapters.filter(c=>c.target&&c.pct<100),over=due.filter(c=>c.target<today),soon=due.filter(c=>c.target>=today&&c.target<=new Date(Date.now()+7*864e5).toISOString().slice(0,10));
let ins=[];if(d.length>1){const a=d[d.length-1],b=d[d.length-2];if(acc(a)>acc(b))ins.push('Your accuracy improved compared with your previous test.');if(a.neg>b.neg)ins.push('Negative marks increased in the last test.');if(pct(a)>pct(b))ins.push('Your score rose by '+f1(pct(a)-pct(b))+' points.')}
if(d.length){const s=['Physics','Chemistry','Mathematics'].map(k=>[k,d.reduce((a,t)=>a+t[k[0].toLowerCase()],0)]).sort((a,b)=>b[1]-a[1]);if(s[0][1]>s[2][1])ins.push(s[0][0]+' is currently your highest-scoring subject.')}
return head()+`<div class="card"><div class="row"><span class="tag">${S.qc}</span><button class="b g" onclick="const k=Object.keys(Q);S.qc=k[(k.indexOf(S.qc)+1)%k.length];S.qi++;save();render()">Change quote</button></div><p style="margin:8px 0 0;font-size:17px">“${q}”</p></div>
<div class="card"><h2>NEXT TEST</h2>${nx?`<b>${esc(nx.name)}</b> <span class="tag">${esc(nx.type)}</span><div class="mu">${nx.date}</div><div class="cd" id="cd" data-t="${nx.date}T${nx.time||'09:00'}"></div>`:`<div class="em" style="padding:8px">No upcoming test scheduled.<br><br><button class="b" onclick="testForm()">+ Schedule Test</button></div>`}</div>
<div class="grid">${cards.map(c=>`<div class="st"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>
<div class="card" style="margin-top:12px"><h2>Today's Targets</h2>${!S.chapters.length?'<div class="mu">Add chapters with target dates in Syllabus to see targets here.</div>':`<div class="mu">Overdue: ${over.length} · Due within 7 days: ${soon.length}</div>`+[...over,...soon].map(c=>`<div class="row" style="padding:5px 0"><span><span style="color:${SUB[c.subj]}">●</span> ${esc(c.name)} <span class="mu">${c.target}${c.target<today?' · overdue':''}</span></span><button class="b g" onclick="setPct('${c.id}',100)">Done</button></div>`).join('')}`}</div>
<div class="card"><h2>Insights</h2>${ins.length?ins.map(i=>`<div>• ${i}</div>`).join(''):'<div class="mu">Insights appear once your recorded tests support them.</div>'}</div>
<div class="card"><h2>Recent Tests</h2>${d.length?d.slice(-3).reverse().map(testCard).join(''):'<div class="em">No tests recorded yet.<br>Add your first JEE test to start tracking performance.</div>'}</div>`}
function testCard(t){const s=status(t);const done=t.status==='Completed'&&t.scored!=null;return `<div class="card" style="margin:8px 0"><div class="row"><b>${esc(t.name)}</b><span class="tag">${s}</span></div><div class="mu">${t.date} · ${esc(t.type)}${t.link?` · <a href="${esc(t.link)}" target="_blank" rel="noopener">link</a>`:''}</div>${done?`<div style="margin-top:6px"><b>${t.scored}/${t.total}</b> (${f1(pct(t))}%) · Accuracy ${f1(acc(t))}% · Wrong ${t.wrong} · Neg ${t.neg}</div><div class="mu"><span style="color:var(--ph)">Phy ${t.p}</span> · <span style="color:var(--ch)">Chem ${t.c}</span> · <span style="color:var(--ma)">Math ${t.m}</span> · Attempt ${f1(att(t))}%</div>`:''}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="b g" onclick="testForm('${t.id}')">${done?'Edit':'Enter result'}</button><button class="b g" onclick="delTest('${t.id}')">Delete</button></div></div>`}
let tf='All',ts='';
function tests(){let L=[...S.tests].sort((a,b)=>b.date.localeCompare(a.date)).filter(t=>(tf==='All'||status(t)===tf)&&t.name.toLowerCase().includes(ts.toLowerCase()));
return head()+`<div class="row"><h1>Tests</h1><button class="b" onclick="testForm()">+ Add Test</button></div><div class="f2" style="margin:10px 0"><input placeholder="Search tests" value="${esc(ts)}" oninput="ts=this.value;render();document.querySelector('[placeholder=\\'Search tests\\']').focus()" aria-label="Search tests"><select onchange="tf=this.value;render()" aria-label="Status filter">${['All','Planned','Completed','Missed'].map(x=>`<option ${x===tf?'selected':''}>${x}</option>`).join('')}</select></div>`+(L.length?L.map(testCard).join(''):`<div class="em">No tests recorded yet.<br>Start tracking your JEE performance.<br><br><button class="b" onclick="testForm()">+ Add First Test</button></div>`)}
function testForm(id){const t=S.tests.find(x=>x.id===id)||{status:'Planned',type:'Coaching Test',date:new Date().toISOString().slice(0,10),total:300,tq:75};const D=$('#dlg');
const v=(k,d='')=>esc(t[k]??d);
D.innerHTML=`<form method="dialog" onsubmit="return false"><h2>${id?'Edit':'New'} Test</h2><label>Test name</label><input id="f_name" value="${v('name')}"><div class="f2"><div><label>Date</label><input id="f_date" type="date" value="${v('date')}"></div><div><label>Time</label><input id="f_time" type="time" value="${v('time','09:00')}"></div><div><label>Type</label><select id="f_type">${['JEE Main','JEE Advanced','Coaching Test','Chapter Test','Full Syllabus Test','Custom'].map(x=>`<option ${x===t.type?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Status</label><select id="f_status" onchange="$('#res').hidden=this.value!=='Completed'">${['Planned','Completed','Missed'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Total marks</label><input id="f_total" type="number" value="${v('total')}"></div><div><label>Total questions</label><input id="f_tq" type="number" value="${v('tq')}"></div></div><label>Test link</label><input id="f_link" type="url" value="${v('link')}">
<div id="res" ${t.status==='Completed'?'':'hidden'}><h2 style="margin-top:14px">Result</h2><div class="f2"><div><label>Marks scored</label><input id="f_scored" type="number" value="${v('scored')}"></div><div><label>Negative marks</label><input id="f_neg" type="number" value="${v('neg')}"></div><div><label>Correct</label><input id="f_correct" type="number" value="${v('correct')}"></div><div><label>Wrong</label><input id="f_wrong" type="number" value="${v('wrong')}"></div><div><label style="color:var(--ph)">Physics marks</label><input id="f_p" type="number" value="${v('p')}"></div><div><label style="color:var(--ch)">Chemistry marks</label><input id="f_c" type="number" value="${v('c')}"></div><div><label style="color:var(--ma)">Maths marks</label><input id="f_m" type="number" value="${v('m')}"></div></div><div class="mu">Unattempted, accuracy and percentage are calculated automatically.</div></div>
<div id="e" class="err" role="alert"></div><div class="row" style="margin-top:12px"><button class="b g" onclick="$('#dlg').close()">Cancel</button><button class="b" onclick="saveTest('${id||''}')">Save</button></div></form>`;D.showModal()}
function saveTest(id){const g=k=>$('#f_'+k).value,E=m=>($('#e').textContent=m,beep(180),false);
const t={id:id||uid(),name:g('name').trim(),date:g('date'),time:g('time'),type:g('type'),status:g('status'),total:n(g('total')),tq:n(g('tq')),link:g('link')};
if(!t.name)return E('Test name cannot be empty.');if(!t.date||isNaN(new Date(t.date)))return E('Please enter a valid date.');if(t.total<=0)return E('Total marks must be greater than zero.');
if(t.status==='Completed'){Object.assign(t,{scored:n(g('scored')),neg:n(g('neg')),correct:n(g('correct')),wrong:n(g('wrong')),p:n(g('p')),c:n(g('c')),m:n(g('m'))});
if(g('scored')==='')return E('Enter marks scored.');if(t.scored>t.total)return E('Marks scored cannot exceed total marks.');if(t.correct+t.wrong>t.tq)return E('Attempted questions cannot be greater than total questions.');if([t.scored,t.neg,t.correct,t.wrong].some(x=>x<0))return E('Values cannot be negative.');
t.un=t.tq-t.correct-t.wrong;mark()}
const i=S.tests.findIndex(x=>x.id===t.id);i>=0?S.tests[i]=t:S.tests.push(t);save();$('#dlg').close();beep(660);toast('Test saved');render()}
function delTest(id){if(confirm('Delete this test permanently?')){S.tests=S.tests.filter(t=>t.id!==id);save();render()}}
function syllabus(){const subs=Object.keys(SUB);const all=S.chapters,avg=l=>l.length?Math.round(l.reduce((a,c)=>a+c.pct,0)/l.length):0;
return head()+`<div class="row"><h1>Syllabus</h1><button class="b" onclick="chForm()">+ Chapter</button></div>`+(all.length?`<div class="card row" style="justify-content:space-around">${pie(avg(all),'var(--ac)','Overall')}${subs.map(s=>pie(avg(all.filter(c=>c.subj===s)),SUB[s],s)).join('')}</div>`:'')+(all.length?subs.map(s=>{const l=all.filter(c=>c.subj===s);return l.length?`<div class="card"><h2 style="color:${SUB[s]}">${s}</h2>${l.map(c=>`<div style="padding:6px 0"><div class="row"><span>${esc(c.name)} <span class="mu">${c.target?'· target '+c.target:''}</span></span><span class="mu">${c.pct>=100?'Completed':c.pct>0?'Studying':'Not started'}</span></div><input type="range" min="0" max="100" step="10" value="${c.pct}" onchange="setPct('${c.id}',+this.value)" aria-label="${esc(c.name)} completion"><div class="bar"><i style="width:${c.pct}%;background:${SUB[s]}"></i></div><button class="b g" style="margin-top:4px;padding:3px 8px;font-size:12px" onclick="S.chapters=S.chapters.filter(x=>x.id!=='${c.id}');save();render()">Remove</button></div>`).join('')}</div>`:''}).join(''):`<div class="em">Add your first chapter to start tracking syllabus progress.<br><br><button class="b" onclick="chForm()">+ Add Chapter</button></div>`)}
function setPct(id,p){const c=S.chapters.find(x=>x.id===id);c.pct=p;if(p>=100){mark();beep(660)}save();render()}
function chForm(){$('#dlg').innerHTML=`<h2>New Chapter</h2><label>Subject</label><select id="c_s">${Object.keys(SUB).map(s=>`<option>${s}</option>`).join('')}</select><label>Chapter name</label><input id="c_n"><label>Target date</label><input id="c_t" type="date"><div id="e" class="err"></div><div class="row" style="margin-top:12px"><button class="b g" onclick="$('#dlg').close()">Cancel</button><button class="b" onclick="const nm=$('#c_n').value.trim();if(!nm)return $('#e').textContent='Chapter name cannot be empty.';S.chapters.push({id:uid(),subj:$('#c_s').value,name:nm,target:$('#c_t').value,pct:0});save();$('#dlg').close();render()">Add</button></div>`;$('#dlg').showModal()}
function chart(pts,lab){if(pts.length<2)return'';const W=640,H=220,P=34,mx=Math.max(...pts),mn=Math.min(...pts),r=mx-mn||1,x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)/r*(H-2*P);
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="${lab} trend"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--ac)"/><text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" font-size="11" fill="currentColor">${f1(v)}</text>`).join('')}<text x="4" y="14" font-size="11" fill="var(--mu)">max ${f1(mx)}</text><text x="4" y="${H-8}" font-size="11" fill="var(--mu)">min ${f1(mn)}</text></svg>`}
function analytics(){const d=done();const M={marks:t=>t.scored,percentage:pct,accuracy:acc,'attempt rate':att};const pts=d.map(M[metric]);
return head()+`<h1>Analytics</h1>`+(d.length<2?`<div class="card em">Complete at least two tests to unlock your improvement curve.</div>`:`<div class="card"><div class="row"><h2>Test improvement curve</h2><select style="width:auto" onchange="metric=this.value;render()" aria-label="Metric">${Object.keys(M).map(k=>`<option ${k===metric?'selected':''}>${k}</option>`).join('')}</select></div>${chart(pts,metric)}<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="st"><span>Latest</span><b>${f1(pts.at(-1))}</b></div><div class="st"><span>Average</span><b>${f1(pts.reduce((a,b)=>a+b)/pts.length)}</b></div><div class="st"><span>Best</span><b>${f1(Math.max(...pts))}</b></div><div class="st"><span>Lowest</span><b>${f1(Math.min(...pts))}</b></div><div class="st"><span>Vs previous</span><b>${f1(pts.at(-1)-pts.at(-2))}</b></div><div class="st"><span>Trend</span><b>${pts.at(-1)>pts[0]?'↑ Up':pts.at(-1)<pts[0]?'↓ Down':'→ Flat'}</b></div></div></div>
<div class="card"><h2>Subject marks (average)</h2>${Object.keys(SUB).map(s=>{const k=s[0].toLowerCase(),a=d.reduce((x,t)=>x+t[k],0)/d.length;return `<div class="row"><span style="color:${SUB[s]}">${s}</span><b>${f1(a)}</b></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,a/(Math.max(...d.map(t=>t.total))/3)*100))}%;background:${SUB[s]}"></i></div>`}).join('')}</div>
<div class="card"><h2>Negative marks per test</h2>${chart(d.map(t=>t.neg),'negative marks')}</div>`)}
function more(){return head()+`<h1>More</h1><div class="card"><h2>Settings</h2><label>Student name</label><input value="${esc(S.name)}" onchange="S.name=this.value;save();render()"><label>Theme</label><select onchange="S.dark=this.value==='system'?null:this.value==='dark';theme();save()"><option value="system" ${S.dark===null?'selected':''}>System</option><option value="light" ${S.dark===false?'selected':''}>Light</option><option value="dark" ${S.dark===true?'selected':''}>Dark</option></select><div class="row" style="margin-top:10px"><span>Animations</span><input type="checkbox" style="width:auto" ${S.anim?'checked':''} onchange="S.anim=this.checked;theme();save()"></div></div>
<div class="card"><h2>Backup</h2><div class="mu">Last backup: ${S.last?new Date(S.last).toLocaleString():'never'}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="b" onclick="exp()">Export JSON</button><button class="b g" onclick="csv()">Export CSV</button><label class="b g" style="margin:0">Import JSON<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="b g" style="color:var(--rd)" onclick="clr()">Clear all data</button></div></div>
<div class="card"><h2>Coming next</h2><div class="mu">Mistake Book, Study Records, Goals, attachments, global search, calendar and PDF reports are planned for later versions of this app.</div></div>`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exp(){S.last=Date.now();save();dl('jee-pulse-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'jee-pulse',v:1,data:S}),'application/json');toast('Backup exported')}
function csv(){const d=done();if(!d.length)return toast('No completed tests to export yet.');const h=['name','date','type','scored','total','correct','wrong','neg','physics','chemistry','maths'];dl('jee-pulse-tests.csv',[h.join(','),...d.map(t=>[`"${t.name.replace(/"/g,'""')}"`,t.date,t.type,t.scored,t.total,t.correct,t.wrong,t.neg,t.p,t.c,t.m].join(','))].join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result);if(j.app!=='jee-pulse'||!j.data)throw 0}catch(e){return toast('Invalid backup file.')}
const D=j.data,nt=(D.tests||[]).length,nc=(D.chapters||[]).length;
if(!confirm(`Backup contains ${nt} tests and ${nc} chapters.\n\nOK = MERGE (adds new records, skips duplicates)\nCancel = choose another option`)){if(confirm('REPLACE all current data with this backup? This cannot be undone.')){S={...S,...D};save();theme();render();toast('Data replaced')}return}
const ti=new Set(S.tests.map(t=>t.id)),ci=new Set(S.chapters.map(c=>c.id));const at=(D.tests||[]).filter(t=>!ti.has(t.id)),ac2=(D.chapters||[]).filter(c=>!ci.has(c.id));S.tests.push(...at);S.chapters.push(...ac2);save();render();toast(`Merged ${at.length} tests, ${ac2.length} chapters; ${nt-at.length+nc-ac2.length} duplicates skipped`)};r.onerror=()=>toast('Could not read file.');r.readAsText(f)}
function clr(){if(confirm('Delete ALL JEE PULSE data? This cannot be undone. Export a backup first.')&&prompt('Type DELETE to confirm')==='DELETE'){S={...S,tests:[],chapters:[],log:[],name:''};save();render()}}
function render(){$('#main').innerHTML={home,tests,syllabus,analytics,more}[view]();tick()}
function tick(){const e=$('#cd');if(!e)return;const ms=new Date(e.dataset.t)-new Date();if(ms<=0){return render()}const s=Math.floor(ms/1e3);e.innerHTML=[['Days',Math.floor(s/86400)],['Hours',Math.floor(s%86400/3600)],['Min',Math.floor(s%3600/60)],['Sec',s%60]].map(([l,v])=>`<div><b>${String(v).padStart(2,'0')}</b><span class="mu">${l}</span></div>`).join('')}
setInterval(tick,1000);
(async()=>{await open();await load();theme();nav();render()})();
</script></body></html>
